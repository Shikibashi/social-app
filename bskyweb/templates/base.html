<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="referrer" content="origin-when-cross-origin">
  <!--
    Preconnect to essential domains
  -->
  <title>{%- block head_title -%}Edriffles{%- endblock -%}</title>

  <!-- Hello Humans! API docs at https://atproto.com -->

  <link rel="preload" as="font" type="font/woff2" href="{{ staticCDNHost }}/static/media/InterVariable.c504db5c06caaf7cdfba.woff2" crossorigin>

  <style>
    /**
     * Minimum styles required to render splash.
     *
     * ALL OTHER STYLES BELONG IN `src/style.css`
     *
     * THIS NEEDS TO BE DUPLICATED IN `bskyweb/templates/base.html`
     */
    @font-face {
      font-family: 'InterVariable';
      src: url("{{ staticCDNHost }}/static/media/InterVariable.c504db5c06caaf7cdfba.woff2") format('woff2');
      font-weight: 300 1000;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'InterVariableItalic';
      src: url("{{ staticCDNHost }}/static/media/InterVariable-Italic.01dcbad1bac635f9c9cd.woff2") format('woff2');
      font-weight: 300 1000;
      font-style: italic;
      font-display: swap;
    }
    html,
    body {
      margin: 0px;
      padding: 0px;
      font-family: InterVariable, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
      text-rendering: optimizeLegibility;
      /* Platform-specific reset */
      -webkit-overflow-scrolling: touch;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -ms-overflow-style: scrollbar;
      font-synthesis-weight: none;
    }
    :root {
      --text: #f9f3ff;
      --background: #050719;
      --backgroundLight: #12144b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --text: #f9f3ff;
        --background: #050719;
        --backgroundLight: #12144b;
      }
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --text: #11132d;
        --background: #d6d9e8;
        --backgroundLight: #f4f3eb;
      }
    }
    html,
    body,
    #root {
      display: flex;
      flex: 1 0 auto;
      min-height: 100%;
      width: 100%;
    }
    html.theme--light,
    html.theme--light body,
    html.theme--light #root {
      background-color: #d6d9e8;
      --text: #11132d;
      --background: #d6d9e8;
      --backgroundLight: #f4f3eb;
    }
    html.theme--dark,
    html.theme--dark body,
    html.theme--dark #root {
      color-scheme: dark;
      background-color: #050719;
      --text: #f9f3ff;
      --background: #050719;
      --backgroundLight: #12144b;
    }
    html.theme--dim,
    html.theme--dim body,
    html.theme--dim #root {
      color-scheme: dark;
      background-color: #0b0d20;
      --text: #f1efff;
      --background: #0b0d20;
      --backgroundLight: #171a4d;
    }
    #splash {
      display: flex;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      align-items: center;
      justify-content: center;
    }
    #splash svg {
      position: relative;
      top: -50px;
      width: 100px;
    }
    /**
     * We need these styles to prevent shifting due to scrollbar show/hide on
     * OSs that have them enabled by default. This also handles cases where the
     * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
     * shift the content, by forcing the page to show a scrollbar.
     */
    body {
      width: 100%;
      overflow-y: scroll;
    }
  </style>
  <script>
    const storedTheme = localStorage.getItem('ALF_THEME')
    const systemTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
    document.documentElement.classList.add(`theme--${storedTheme || systemTheme}`)
  </script>

  {% include "scripts.html" %}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ staticCDNHost }}/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ staticCDNHost }}/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ staticCDNHost }}/static/favicon-16x16.png">
  <link rel="mask-icon" href="{{ staticCDNHost }}/static/safari-pinned-tab.svg" color="#5530a3">
  <meta name="theme-color">
  <meta name="application-name" content="Edriffles">
  <meta name="generator" content="Edriffles Computer Web">
  {% if noindex %}<meta name="robots" content="noindex{% if nofollow %}, nofollow{% endif %}">{% endif %}
  <meta property="og:site_name" content="Edriffles">
  <meta property="og:logo" content="{{ favicon }}">
  <link type="application/activity+json" href="" />

  {% block html_head_extra -%}{%- endblock %}
</head>
<body>
{%- block body_all %}
  <div id="splash">
    <!-- Edriffles Computer Web mark -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Edriffles">
      <rect x="3" y="3" width="58" height="58" rx="12" fill="#f4f3eb" stroke="#11132d" stroke-width="3"/>
      <circle cx="32" cy="28" r="18" fill="none" stroke="#b189ff" stroke-width="2"/>
      <path d="M32 8v40M12 28h40" stroke="#b189ff" stroke-width="1.5"/>
      <path d="M17 42h30l-6 9H23z" fill="#11132d"/>
      <path d="M22 42l10-15 10 15" fill="#5530a3" stroke="#11132d" stroke-width="1.5"/>
      <path d="M32 15v27" stroke="#ffd45c" stroke-width="2"/>
    </svg>
  </div>
  <div id="root">
  </div>

  <noscript>
    <h1 lang="en">JavaScript Required</h1>
    <p lang="en">This is a heavily interactive web application, and JavaScript is required. Simple HTML interfaces are possible, but that is not what this is.
    <p lang="en">Learn more about Edriffles at <a href="https://edriffles.us">edriffles.us</a> and about the AT Protocol at <a href="https://atproto.com">atproto.com</a>.
    {% block noscript_extra %}{% endblock %}
  </noscript>
{% endblock -%}
</body>
</html>
