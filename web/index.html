<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="theme-color" content="#d5d8de">
    <!--
      This viewport works for phones with notches.
      It's optimized for gestures by disabling global zoom.
     -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
    />
    <!--
      Preconnect to essential domains
    -->
    <link rel="icon" type="image/svg+xml" href="/plumbline-mark.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#B79A5A">
    <title>%WEB_TITLE%</title>
    <meta name="application-name" content="%WEB_TITLE%">
    <meta name="description" content="Plumbline, an independent social client for the AT Protocol.">
    <meta property="og:site_name" content="Plumbline">

    <link rel="preload" as="font" type="font/woff2" href="/static/media/InterVariable.c504db5c06caaf7cdfba.woff2" crossorigin>
    <link rel="stylesheet" href="/static/style.css">

    <style>
      /**
       * Minimum styles required to render splash.
       *
       * ALL OTHER STYLES BELONG IN `src/style.css`
       *
       * THIS NEEDS TO BE DUPLICATED IN `bskyweb/templates/base.html`
       */
      @font-face {
        font-family: 'InterVariable';
        src: url(/static/media/InterVariable.c504db5c06caaf7cdfba.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'InterVariableItalic';
        src: url(/static/media/InterVariable-Italic.01dcbad1bac635f9c9cd.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: italic;
        font-display: swap;
      }
      html,
      body {
        margin: 0px;
        padding: 0px;
        font-family: Verdana, 'DejaVu Sans', Tahoma, 'Noto Sans', Arial, sans-serif;
        text-rendering: optimizeLegibility;
        /* Platform-specific reset */
        -webkit-overflow-scrolling: touch;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -ms-overflow-style: scrollbar;
        font-synthesis-weight: none;
      }
      :root {
        --text: #f6f4ef;
        --background: #0b1020;
        --backgroundLight: #202b43;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --text: #f6f4ef;
          --background: #0b1020;
          --backgroundLight: #202b43;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --text: #151f3a;
          --background: #d5d8de;
          --backgroundLight: #f6f4ef;
        }
      }
      html,
      body,
      #root {
        display: flex;
        flex: 1 0 auto;
        min-height: 100%;
        width: 100%;
      }
      html.theme--light,
      html.theme--light body,
      html.theme--light #root {
        background-color: #d5d8de;
        --text: #151f3a;
        --background: #d5d8de;
        --backgroundLight: #f6f4ef;
      }
      html.theme--dark,
      html.theme--dark body,
      html.theme--dark #root {
        color-scheme: dark;
        background-color: #0b1020;
        --text: #f6f4ef;
        --background: #0b1020;
        --backgroundLight: #202b43;
      }
      html.theme--dim,
      html.theme--dim body,
      html.theme--dim #root {
        color-scheme: dark;
        background-color: #101828;
        --text: #f1eee7;
        --background: #101828;
        --backgroundLight: #24324b;
      }
      #splash {
        display: flex;
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        align-items: center;
        justify-content: center;
      }
      #splash svg {
        position: relative;
        top: -50px;
        width: 100px;
      }
      /**
       * We need these styles to prevent shifting due to scrollbar show/hide on
       * OSs that have them enabled by default. This also handles cases where the
       * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
       * shift the content, by forcing the page to show a scrollbar.
       */
      body {
        width: 100%;
        overflow-y: scroll;
      }
    </style>
    <script>
      const storedTheme = localStorage.getItem('ALF_THEME')
      const systemTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      document.documentElement.classList.add(`theme--${storedTheme || systemTheme}`)
    </script>
  </head>

  <body>
    <!--
      A generic no script element with a reload button and a message.
      Feel free to customize this however you'd like.
    -->
    <noscript>
      <form
        action=""
        style="
          background-color: #fff;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 9999;
        "
      >
        <div
          style="
            font-size: 18px;
            font-family: Helvetica, sans-serif;
            line-height: 24px;
            margin: 10%;
            width: 80%;
          "
        >
          <p lang="en">Oh no! It looks like JavaScript is not enabled in your browser.</p>
          <p lang="en" style="margin: 20px 0;">
            <button
              type="submit"
              style="
                background-color: #4630eb;
                border-radius: 100px;
                border: none;
                box-shadow: none;
                color: #fff;
                cursor: pointer;
                font-weight: bold;
                line-height: 20px;
                padding: 6px 16px;
              "
            >
              Reload
            </button>
          </p>
        </div>
      </form>
    </noscript>

    <!-- The root element for your Expo app. -->
    <div id="splash">
      <!-- Plumbline mark: keep first paint aligned with the shared brand asset. -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Plumbline">
        <rect width="64" height="64" rx="10" fill="#151F3A"/>
        <rect x="3" y="3" width="58" height="58" rx="8" fill="none" stroke="#B79A5A" stroke-width="1"/>
        <path d="M32 7v28" stroke="#F6F4EF" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M32 7v28" stroke="#B79A5A" stroke-width="1" stroke-linecap="round"/>
        <path d="M29 7h6" stroke="#B79A5A" stroke-width="2" stroke-linecap="round"/>
        <path d="M28 35h8l-1.5 4h-5z" fill="#B79A5A" stroke="#F6F4EF" stroke-width=".5"/>
        <path d="M26 39h12l-3 6-3 14-3-14z" fill="#B79A5A" stroke="#F6F4EF" stroke-width=".75" stroke-linejoin="round"/>
        <path d="M32 40v16" stroke="#F6F4EF" stroke-width=".8" stroke-linecap="round"/>
      </svg>
    </div>
    <div id="root">
    </div>
  </body>
</html>
